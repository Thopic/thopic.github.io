<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Dilution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Calculateur de Dilution</h1>

        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'dilution')">Dilution</button>
            <button class="tab-button" onclick="openTab(event, 'yeast')">Quantité de cellules</button>
        </div>

        <div id="dilution" class="tab-content" style="display: block;">
            <div class="input-group">
                <label for="neededOD">L'OD qu'on cherche à avoir</label>
                <input type="number" id="neededOD" placeholder="ex. 0,5" step="0.01" value="0.67" oninput="calculateDilution()">
            </div>
            <div class="input-group">
                <label for="measuredOD">L'OD mesuré</label>
                <input type="number" id="measuredOD" placeholder="ex. 1,2" step="0.01" oninput="calculateDilution()">
            </div>
            <div class="input-group">
                <label class="dilution-label">Dilution :</label>
                <div class="input-inline">
                    <div class="input-subgroup">
                        <label class="input-inline-label">Volume mis (µL)</label>
                        <input type="number" id="volumePut" placeholder="ex. 50" value="50" oninput="calculateDilution()">
                    </div>
                    <div class="input-subgroup">
                        <label class="input-inline-label">Volume total (µL)</label>
                        <input type="number" id="totalVolume" placeholder="ex. 500" value="500" oninput="calculateDilution()">
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label for="volumeToTake1">Volume à prélever (µL) pour 1 mL</label>
                <input type="text" id="volumeToTake1" readonly>
            </div>
            <div class="input-group">
                <label for="volumeToTake5">Volume à prélever (µL) pour 5 mL</label>
                <input type="text" id="volumeToTake5" readonly>
            </div>
        </div>

        <div id="yeast" class="tab-content">
            <div class="input-group">
                <label for="desiredVolume">Quantité de levure à OD=1 voulu (mL)</label>
                <input type="number" id="desiredVolume" placeholder="ex. 1" step="0.1" value="1" oninput="calculateYeast()">
            </div>
            <div class="input-group">
                <label for="measuredODYeast">L'OD mesuré</label>
                <input type="number" id="measuredODYeast" placeholder="ex. 1,2" step="0.01" oninput="calculateYeast()">
            </div>
            <div class="input-group">
                <label class="dilution-label">Dilution :</label>
                <div class="input-inline">
                    <div class="input-subgroup">
                        <label class="input-inline-label">Volume mis (µL)</label>
                        <input type="number" id="volumePutYeast" placeholder="ex. 50" value="50" oninput="calculateYeast()">
                    </div>
                    <div class="input-subgroup">
                        <label class="input-inline-label">Volume total (µL)</label>
                        <input type="number" id="totalVolumeYeast" placeholder="ex. 500" value="500" oninput="calculateYeast()">
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label for="yeastVolume">Volume à prélever (µL)</label>
                <input type="text" id="yeastVolume" readonly>
            </div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            const tabContents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].style.display = "none";
            }
            const tabButtons = document.getElementsByClassName("tab-button");
            for (let i = 0; i < tabButtons.length; i++) {
                tabButtons[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.classList.add("active");
        }

        function calculateDilution() {
            const neededOD = parseFloat(document.getElementById('neededOD').value.replace(',', '.'));
            const measuredOD = parseFloat(document.getElementById('measuredOD').value.replace(',', '.'));
            const volumePut = parseFloat(document.getElementById('volumePut').value);
            const totalVolume = parseFloat(document.getElementById('totalVolume').value);

            if (isNaN(neededOD) || isNaN(measuredOD) || isNaN(volumePut) || isNaN(totalVolume) || measuredOD === 0 || totalVolume === 0) {
                document.getElementById('volumeToTake1').value = "";
                document.getElementById('volumeToTake5').value = "";
                return;
            }

            const dilutionFactor = totalVolume / volumePut;
            const adjustedMeasuredOD = measuredOD * dilutionFactor;
            const volumeToTake1 = (neededOD / adjustedMeasuredOD) * 1000;

            document.getElementById('volumeToTake1').value = volumeToTake1.toFixed(2);
            document.getElementById('volumeToTake5').value = (volumeToTake1 * 5).toFixed(2);
        }

        function calculateYeast() {
            const desiredVolume = parseFloat(document.getElementById('desiredVolume').value.replace(',', '.'));
            const measuredODYeast = parseFloat(document.getElementById('measuredODYeast').value.replace(',', '.'));
            const volumePutYeast = parseFloat(document.getElementById('volumePutYeast').value);
            const totalVolumeYeast = parseFloat(document.getElementById('totalVolumeYeast').value);

            if (isNaN(desiredVolume) || isNaN(measuredODYeast) || isNaN(volumePutYeast) || isNaN(totalVolumeYeast) || measuredODYeast === 0 || totalVolumeYeast === 0) {
                document.getElementById('yeastVolume').value = "";
                return;
            }

            const dilutionFactor = totalVolumeYeast / volumePutYeast;
            const adjustedMeasuredOD = measuredODYeast * dilutionFactor;
            const yeastVolume = (desiredVolume * 1000) / adjustedMeasuredOD;

            document.getElementById('yeastVolume').value = yeastVolume.toFixed(2);
        }
    </script>
</body>
</html>
